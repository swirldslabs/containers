# Derive the client address from a header set by a trusted reverse proxy, so that %h, %a,
# REMOTE_ADDR and anything built on them report the visitor rather than the proxy.
#
# Only the proxy directives matching a configured variable are uncommented at boot. This conf
# is enabled only when at least one of them is set, so the module is never active without a
# declared set of trusted proxies -- trusting every peer would let any client spoof its address.
<IfModule mod_remoteip.c>
    RemoteIPHeader ${HTTPD_GLOBAL_REMOTE_IP_HEADER}
    #RemoteIPInternalProxy ${HTTPD_GLOBAL_REMOTE_IP_INTERNAL_PROXY}
    #RemoteIPTrustedProxy ${HTTPD_GLOBAL_REMOTE_IP_TRUSTED_PROXY}
</IfModule>
